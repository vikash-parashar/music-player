name: Fetch design asset
# Downloads one image (for example an AI-generated hero picture) into the repo on the
# branch it runs on, so design assets made outside GitHub can be added without a laptop.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "https URL of the file"
        required: true
      path:
        description: "Repo path to save it to"
        required: true
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        env:
          URL: ${{ inputs.url }}
          DEST: ${{ inputs.path }}
        run: |
          case "$DEST" in *..*|/*) echo "bad path"; exit 1;; esac
          mkdir -p "$(dirname "$DEST")"
          curl -fsSL --max-filesize 20000000 -o "$DEST" "$URL"
          file "$DEST"
      - name: Commit
        env:
          DEST: ${{ inputs.path }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "Add design asset $DEST" || exit 0
          git push
