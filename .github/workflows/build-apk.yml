name: Build APK

on:
  push:
    # claude/** branches build too, so feature work is compiled and testable before it reaches main.
    branches: [main, "claude/**"]
    # The website has its own workflow (deploy-site.yml); website-only changes don't need an APK.
    paths-ignore: ["website/**", ".github/workflows/deploy-site.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's Ubuntu runners ship with the Android SDK preinstalled.
      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        env:
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          AUDD_API_TOKEN: ${{ secrets.AUDD_API_TOKEN }}
          OWNER_API_URL: ${{ vars.OWNER_API_URL }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "JAMENDO_CLIENT_ID=${JAMENDO_CLIENT_ID}" >> local.properties
          echo "AUDD_API_TOKEN=${AUDD_API_TOKEN}" >> local.properties
          echo "OWNER_API_URL=${OWNER_API_URL}" >> local.properties
          echo "SUPPORT_EMAIL=${SUPPORT_EMAIL}" >> local.properties

      # Ampli-N.apk is the fast, non-debuggable test build (qa). Ampli-N-protest.apk is the slower
      # debuggable build that keeps the test "unlock Pro" switch, for trying Pro features.
      - name: Build test APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleQa assembleDebug assembleR8

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/qa/app-qa.apk "Ampli-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "Ampli-${GITHUB_RUN_NUMBER}-protest.apk"
          cp app/build/outputs/apk/r8/app-r8.apk "Ampli-${GITHUB_RUN_NUMBER}-r8.apk"

      # Play Store bundle. Always built (so release-only problems show up early), but only
      # signed and attached when the upload key secrets exist. Test Pro switch is debug-only.
      - name: Build Play release bundle (AAB)
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ vars.ADMOB_BANNER_ID }}
          ADMOB_REWARDED_ID: ${{ vars.ADMOB_REWARDED_ID }}
        run: |
          if [ -n "$ADMOB_APP_ID" ]; then echo "ADMOB_APP_ID=${ADMOB_APP_ID}" >> local.properties; fi
          if [ -n "$ADMOB_BANNER_ID" ]; then echo "ADMOB_BANNER_ID=${ADMOB_BANNER_ID}" >> local.properties; fi
          if [ -n "$ADMOB_REWARDED_ID" ]; then echo "ADMOB_REWARDED_ID=${ADMOB_REWARDED_ID}" >> local.properties; fi
          if [ -n "$UPLOAD_KEYSTORE_B64" ]; then
            echo "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            {
              echo "UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks"
              echo "UPLOAD_STORE_PASSWORD=${UPLOAD_STORE_PASSWORD}"
              echo "UPLOAD_KEY_ALIAS=${UPLOAD_KEY_ALIAS}"
              echo "UPLOAD_KEY_PASSWORD=${UPLOAD_KEY_PASSWORD}"
            } >> local.properties
          fi
          ./gradlew --no-daemon bundleRelease
          if [ -n "$UPLOAD_KEYSTORE_B64" ]; then
            cp app/build/outputs/bundle/release/app-release.aab "Ampli-${GITHUB_RUN_NUMBER}.aab"
            # Also inside the AAB, so Play picks it up by itself; kept here in case it is ever needed.
            cp app/build/outputs/mapping/release/mapping.txt "Ampli-${GITHUB_RUN_NUMBER}-mapping.txt"
          else
            echo "::notice::No upload key secrets yet, so the Play bundle was built but not signed or attached."
          fi
          rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: Ampli-apk
          path: |
            Ampli-*.apk
            Ampli-*.aab
            Ampli-*-mapping.txt

      # A release gives a direct download link that opens on the phone.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ampli test build ${{ github.run_number }}
          prerelease: true
          files: |
            Ampli-*.apk
            Ampli-*.aab
            Ampli-*-mapping.txt

  # Installs the R8 (shrunk, like Play) build on an emulator, adds a song, opens Car mode with
  # autoplay and checks that the song actually plays and nothing crashed.
  r8-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Ampli-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Make a 30-second test song
        run: |
          python3 - <<'PY'
          import math, struct, wave
          with wave.open("ampli_test_song.wav", "w") as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(22050)
              w.writeframes(b"".join(struct.pack("<h", int(8000 * math.sin(2 * math.pi * 440 * i / 22050))) for i in range(22050 * 30)))
          PY

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/r8-smoke.sh

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8-smoke-logs
          path: |
            logcat.txt
            session.txt
            screen.png
          if-no-files-found: ignore
