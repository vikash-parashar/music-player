name: Update Play listings

# Sends the store text in distribution/listings (en-US, de-DE, fr-FR, es-ES) to Play Console.
# Manual only. Text only: never uploads a build or screenshots.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  listings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upload store text
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_JSON" ]; then echo "::error::Add the PLAY_SERVICE_ACCOUNT_JSON secret first."; exit 1; fi
          pip install -q google-auth requests
          python tools/play/update_listings.py distribution/listings com.vikash.ampli
